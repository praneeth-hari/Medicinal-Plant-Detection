# =============================================================================
# nginx.conf — Nginx Configuration for MediPlant AI
# =============================================================================
# This configuration sets up Nginx as a reverse proxy that:
#   1. Serves the React/Vite frontend as static files
#   2. Proxies /api/* requests to the FastAPI backend
#   3. Enables gzip compression for faster page loads
#   4. Allows image uploads up to 10 MB
# =============================================================================

server {
    # -----------------------------------------------------------------------
    # Listen on port 80 (HTTP)
    # In production, consider adding a separate server block for HTTPS (443)
    # with TLS certificates and a redirect from HTTP → HTTPS.
    # -----------------------------------------------------------------------
    listen 80;
    server_name localhost;

    # -----------------------------------------------------------------------
    # Client max body size
    # Allows image uploads up to 10 MB. Requests exceeding this limit
    # receive a 413 (Request Entity Too Large) response.
    # -----------------------------------------------------------------------
    client_max_body_size 10M;

    # -----------------------------------------------------------------------
    # Security headers
    # Basic protections against clickjacking, MIME-sniffing, and XSS.
    # -----------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # -----------------------------------------------------------------------
    # Gzip compression
    # Reduces response sizes for text-based content, improving load times
    # over the network. gzip_vary tells caches to store both compressed
    # and uncompressed variants; gzip_proxied enables compression even
    # for proxied requests; gzip_comp_level balances CPU vs compression.
    # -----------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml;

    # -----------------------------------------------------------------------
    # Frontend — serve React SPA static files
    # The built frontend assets (HTML, CSS, JS) are served directly by Nginx
    # from the standard container path /usr/share/nginx/html.
    # try_files supports client-side routing — any URL that doesn't match
    # a real file falls back to index.html so React Router can handle it.
    # -----------------------------------------------------------------------
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # -----------------------------------------------------------------------
    # API proxy — forward /api/* requests to the FastAPI backend
    # The backend container is reachable at http://backend:8000 via the
    # Docker network (the service name defined in docker-compose.yml).
    # -----------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:8000/api/;

        # Pass the real client IP address to the backend
        proxy_set_header X-Real-IP $remote_addr;

        # Append the client address to the X-Forwarded-For chain so the
        # backend can identify the original requester behind proxies.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Preserve the original Host header for correct URL generation
        proxy_set_header Host $host;

        # Inform the backend whether the client used HTTP or HTTPS
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (for potential future streaming / live updates)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts — increase if ML model inference takes longer
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # -----------------------------------------------------------------------
    # Static asset caching
    # Aggressively cache fingerprinted assets produced by the frontend
    # build tool (Vite). The "immutable" directive tells browsers never
    # to revalidate these hashed files.
    # -----------------------------------------------------------------------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
