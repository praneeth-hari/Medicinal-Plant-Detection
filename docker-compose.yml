# ============================================================
# 🌿 Medicinal Plant Detection & RAG Assistant
# Docker Compose Configuration
# ============================================================

version: "3.8"

services:
  # ----- Backend (FastAPI) -----
  backend:
    build:
      context: ./backend
      dockerfile: ../deployment/Dockerfile.backend
    container_name: medicinal-plant-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - ./ml:/app/ml
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/app.db}
      - SECRET_KEY=${SECRET_KEY:-changeme}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - CHROMA_PERSIST_DIR=${CHROMA_PERSIST_DIR:-./data/embeddings}
      - MODEL_PATH=${MODEL_PATH:-./data/models}
      - ENVIRONMENT=${ENVIRONMENT:-development}
    restart: unless-stopped
    networks:
      - app-network

  # ----- Frontend (React + Nginx) -----
  frontend:
    build:
      context: ./frontend
      dockerfile: ../deployment/Dockerfile.frontend
    container_name: medicinal-plant-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
