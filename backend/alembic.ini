# ============================================================
# Alembic Configuration — Medicinal Plant RAG Backend
# ============================================================

[alembic]
# Path to the migrations environment module.
script_location = migrations

# Template used for new migration files.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Truncate long revision identifiers in filenames.
truncate_slug_length = 40

# sys.path prepend — allows importing project modules.
prepend_sys_path = .

# Timezone to use when rendering the date in migration file names.
# timezone =

# SQLAlchemy URL — overridden at runtime from config/settings.py
sqlalchemy.url = sqlite+aiosqlite:///./medicinal_plants.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
